<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Basit CSS Örneği</title>
  <style>

    body {
      background-color: #f0f0f0; 
      font-family: Arial, sans-serif; 
      margin: 0;
      padding: 0;
    }


    h1 {
      color: #4CAF50; 
      text-align: center; 
      margin-top: 50px; 
    }

    p {
      color: #333333;
      font-size: 16px;
      text-align: center;
    }

    /* Resim stili */
    img {
      display: block; 
      margin: 20px auto; 
      width: 200px; 
      border: 2px solid #4CAF50; 
      border-radius: 10px; 
    }
  </style>
</head>
<body>

  <h1>Benim Basit Portfolyom</h1>
  <p>Bu bölümde projelerimin küçük bir ön izlemesi yer alıyor.</p>

  <img src="https://via.placeholder.com/200x150" alt="Proje Örneği">

</body>
</html>
