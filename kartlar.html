<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güneş Paneli Mağazası</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Güneş Paneli Mağazası</h1>
    <div>
        <a href="classlar_id_input.html"> <--Geri </a>
    </div>
    <div class="card-container">
        
        <div class="card-wrapper">
            <div class="card">
                <div class="card-front marka-vestel">
                    <h2 class="bitcount-font">Vestel</h2>
                    <p>Model: XL-Power</p>
                    <p class="price-tag">50.000 ₺</p>
                </div>
                <div class="card-back img-vestel">
                    <p>Yüksek Verimlilik<br>25 Yıl Garanti</p>
                </div>
            </div>
            <div class="selection-area">
                <input type="checkbox" class="buy-checkbox" id="check-vestel">
                <label for="check-vestel">Bu ürünü satın al</label>
            </div>
        </div>

        <div class="card-wrapper">
            <div class="card">
                <div class="card-front marka-arcelik">
                    <h2 class="bitcount-font">Arçelik</h2>
                    <p>Model: S-Eco</p>
                    <p class="price-tag">10.000 ₺</p>
                </div>
                <div class="card-back img-arcelik">
                    <p>Kompakt Tasarım<br>Kolay Kurulum</p>
                </div>
            </div>
            <div class="selection-area">
                <input type="checkbox" class="buy-checkbox" id="check-arcelik">
                <label for="check-arcelik">Bu ürünü satın al</label>
            </div>
        </div>

        <div class="card-wrapper">
            <div class="card">
                <div class="card-front marka-beko">
                    <h2 class="bitcount-font">Beko</h2>
                    <p>Model: M-Pro</p>
                    <p class="price-tag">25.000 ₺</p>
                </div>
                <div class="card-back img-beko">
                    <p>Fiyat / Performans<br>Akıllı Takip Sistemi</p>
                </div>
            </div>
            <div class="selection-area">
                <input type="checkbox" class="buy-checkbox" id="check-beko">
                <label for="check-beko">Bu ürünü satın al</label>
            </div>
        </div>

    </div>

    <div class="footer-action">
        <button class="main-button" id="buy-btn">
            Seçili Ürünleri Satın Al
        </button>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
