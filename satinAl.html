<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/satinAl.css">
</head>
<body>
    <div class="form-card">
        <a href="/anasayfa.html"><img src="/fotolarim/back-arrow.png" alt="" style="width: 50px;"></a>
    <h1>Güneş Paneli Satın Al</h1>
    <p>Güneş paneli kullanımı günümüzde çok yaygın, amacı enerji tasarrufu sağlamak.</p>

    <label>
        <input type="checkbox"> Güneş Paneli Satın Almak İstiyorum
    </label>
    <br>
    <label>
        Güneş Paneli Satın Alma Tarihi
        <input type="date">
    </label>
    <br>
    <label>
        Email:
        <input type="email" placeholder="Email Giriniz...">
    </label>
    <br>
    <label>
        Şifre:
        <input type="password" placeholder="Şifrenizi Giriniz...">
    </label>
    <br>
    <p>Panel Boyutu:</p>
    <label><input type="radio" name="panel" value="XL"> XL</label>
    <label><input type="radio" name="panel" value="L"> L</label>
    <label><input type="radio" name="panel" value="M"> M</label>
    <label><input type="radio" name="panel" value="S"> S</label>
    <br>
    <input type="submit" value="Satın Al">
    <a href="anasayfa.html" class="btn">Anasayfa</a>
</div>
</body>
</html>
